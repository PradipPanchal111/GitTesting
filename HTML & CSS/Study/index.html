<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - Home Page</title>
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f9f9f9;
    }

    /* Header */
    header {
      background-color: darkgrey;
      color: deepskyblue;
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      font-size: 60px;
      letter-spacing: 10px;
    }

    hr {
      border: none;
      height: 2px;
      background-color: deepskyblue;
      width: 80%;
      margin: 20px auto;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: center;
      gap: 50px;
      padding: 20px 0;
      background-color: #f0f0f0;
    }

    nav a {
      font-size: 35px;
      color: black;
      text-decoration: none;
      transition: 0.3s;
    }

    nav a:hover {
      color: deepskyblue;
      transform: scale(1.1);
    }

    /* Main content */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 20px;
    }

    main img {
      height: 50px;
      cursor: pointer;
      transition: 0.3s;
    }

    main img:hover {
      transform: scale(1.2);
    }

    table {
      border: 3px solid black;
      border-collapse: collapse;
      width: 80%;
      margin: auto;
      border-radius: 10px;
      overflow: hidden;
      background-color: white;
    }

    table th, table td {
      border: 1px solid black;
      padding: 12px;
      text-align: center;
    }

    table th {
      background-color: #ddd;
    }

    /* Form */
    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
    }

    form .radio-group {
      display: flex;
      gap: 30px;
    }

    input[type="radio"] {
      accent-color: deepskyblue;
    }

    select {
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    /* Footer */
    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background-color: darkgrey;
      color: white;
      margin-top: 40px;
    }

    footer span {
      margin: 5px 0;
    }

    /* Responsive */
    @media screen and (max-width: 768px) {
      nav {
        flex-direction: column;
        gap: 20px;
      }

      header h1 {
        font-size: 45px;
      }

      nav a {
        font-size: 28px;
      }

      table {
        width: 95%;
      }
    }

  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Portfolio</h1>
  </header>
  <hr>

  <!-- Navigation -->
  <nav>
    <a href="Education.html">Education</a>
    <a href="Experiance.html">Experiance</a>
    <a href="Projects.html">Projects</a>
  </nav>

  <!-- Main Content -->
  <main>
    <!-- Social Link -->
    <div>
      <a href="https://www.google.com/" target="_blank">
        <img src="https://pngimg.com/uploads/google/google_PNG19630.png" alt="Google">
      </a>
    </div>

    <!-- Table -->
    <table>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
      </tr>
      <tr>
        <td>Pradip</td>
        <td>25</td>
        <td>Pune</td>
      </tr>
      <tr>
        <td>Rohit</td>
        <td>27</td>
        <td>Mumbai</td>
      </tr>
    </table>

    <!-- Form -->
    <form action="">
      <div class="radio-group">
        <label><input type="radio" name="class" id="101"> One</label>
        <label><input type="radio" name="class" id="102"> Two</label>
      </div>

      <div>
        <label>Select Your Subject:
          <select>
            <option>Physics</option>
            <option>Chemistry</option>
            <option>Maths</option>
          </select>
        </label>
      </div>
    </form>
    <div>
      <iframe width="560" height="315" src="https://www.youtube.com/embed/HcOc7P5BMi4?si=P5Pi0My81fLz-nsH" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <span style="font-weight: bold;">Contact me :</span>
    <span>Mobile - 8956038711 | Email - pradippanchal345@gmail.com</span>
  </footer>

</body>
</html>
